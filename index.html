function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function mondayOf(k){const d=parseKey(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return keyOf(d)}
function longDate(k){const d=parseKey(k);return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]}
function shortDate(k){const d=parseKey(k);return d.getDate()+" "+MOIS[d.getMonth()].slice(0,4)+(MOIS[d.getMonth()].length>4?".":"")}
function isoWeek(k){const d=parseKey(k);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const y=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-y)/86400000-3+((y.getUTCDay()+6)%7))/7)}

      if(rz){const t=num(p.resto&&p.resto[rz])||650;o.meals[slot]={resto:true,size:rz,away:true,target:t,rs:[]};used+=t;continue}
      if(m.away[p.id]){const t=shareT(slot);o.meals[slot]={away:true,target:t,rs:[]};used+=t;continue}
      const own=(m.own[p.id]||[]).filter(id=>S.recipes[id]);const rs=own.length?own.map(i=>S.recipes[i]):shared[slot].rs;
      const mm={rs,own:own.length>0,chosen:rs.length>0,conflict:rs.some(r=>!allowed(p,r))};o.meals[slot]=mm;
      if(slot==="pdj"||slot==="col"){mm.fixed=true;mm.f=1;mm.target=rs.length?rs.reduce((a,r)=>a+recipeNut(r).k,0):shareT(slot);used+=mm.target}
      else flex.push(slot);
    }
    const rest=Math.max(0,T.k-used);const fs=flex.reduce((a,x)=>a+share(x),0);
    for(const slot of flex){const mm=o.meals[slot];mm.target=Math.max(200,fs?rest*share(slot)/fs:0);
      mm.des=(d.meals[slot].des||[]).filter(e=>S.recipes[e.id]&&num(e.parts&&e.parts[p.id])>0).map(e=>({r:S.recipes[e.id],parts:num(e.parts[p.id])}));
      mm.desK=mm.des.reduce((a,x)=>a+recipeNut(x.r).k*x.parts,0);const mainT=Math.max(150,mm.target-mm.desK);
      const tot=mm.rs.reduce((a,r)=>a+recipeNut(r).k,0);mm.f=tot?clamp(mainT/tot,0.3,3):1}
    o.cur={k:0,p:0,g:0,l:0};
    for(const slot of p.meals){const m=o.meals[slot];if(m.away){o.cur.k+=m.target;o.cur.p+=T.p*m.target/T.k;o.cur.g+=T.g*m.target/T.k;o.cur.l+=T.l*m.target/T.k}else{for(const r of m.rs){const n=recipeNut(r);o.cur.k+=n.k*m.f;o.cur.p+=n.p*m.f;o.cur.g+=n.g*m.f;o.cur.l+=n.l*m.f}for(const x of (m.des||[])){const n=recipeNut(x.r);o.cur.k+=n.k*x.parts;o.cur.p+=n.p*x.parts;o.cur.g+=n.g*x.parts;o.cur.l+=n.l*x.parts}}}
    people[p.id]=o;
  }
  return {d,shared,people,slots};
}
/* ---------- Persistence ---------- */
function applyPath(path,data){
  const [c,id]=path.split("/");
  if(c==="app"){if(id==="settings")S.settings={...DEF_SET,...(data||{})};else if(id==="profiles")S.profilesDoc=data;else S[id]=data||(id==="journal"?{entries:[]}:id==="fridge"?{have:[]}:{items:[]})}
  else{if(data)S[c][id]={...data,id};else delete S[c][id]}
}
function put(path,data){
  applyPath(path,clone(data));render();
  if(db){db.doc(path).set(data).catch(e=>{toast(e&&e.code==="quota_exceeded"?"Stockage plein : supprime d'anciennes données.":"Enregistrement impossible, réessaie.")})}
  else saveLocal();
}
function remove(path){applyPath(path,null);render();if(db)db.doc(path).delete().catch(()=>toast("Suppression impossible, réessaie."));else saveLocal()}
function saveLocal(){try{localStorage.setItem("jardin",JSON.stringify({profilesDoc:S.profilesDoc,settings:S.settings,recipes:S.recipes,foods:S.foods,days:S.days,weeks:S.weeks,shopping:S.shopping,fridge:S.fridge,journal:S.journal}))}catch(e){}}
function loadLocal(){try{const o=JSON.parse(localStorage.getItem("jardin")||"null");if(o)Object.assign(S,o,{settings:{...DEF_SET,...o.settings}})}catch(e){}}
function subscribe(){
  const fail=()=>{};
  const col=(name)=>db.collection(name).onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});S[name]=m;S.loaded=true;render()},fail);
  ["recipes","foods","days","weeks"].forEach(col);
  db.doc("app/settings").onSnapshot(s=>{S.settings={...DEF_SET,...(s.exists?s.data():{})};render()},fail);
  db.doc("app/profiles").onSnapshot(s=>{S.profilesDoc=s.exists?clone(s.data()):null;render()},fail);
  db.doc("app/shopping").onSnapshot(s=>{S.shopping=s.exists?clone(s.data()):{items:[]};render()},fail);
  db.doc("app/fridge").onSnapshot(s=>{S.fridge=s.exists?clone(s.data()):{have:[]};render()},fail);
  db.doc("app/journal").onSnapshot(s=>{S.journal=s.exists?clone(s.data()):{entries:[]};render()},fail);
}

function fridgeMatches(){

  return recipes().map(r=>{const items=(r.items||[]).filter(it=>food(it.f));const core=items.filter(it=>!food(it.f).v);const miss=core.filter(it=>!have.has(it.f));const cov=core.length?(core.length-miss.length)/core.length:0;return {r,cov,miss,core}}).filter(x=>x.core.length&&x.cov>0).sort((a,b)=>b.cov-a.cov||a.miss.length-b.miss.length);
}

function qtyLabel(f,q){

  return s;
}

  document.getElementById("app").innerHTML=v();

  let sh="";

function addShopping(entries,src){
  const items=clone(S.shopping.items||[]);
  for(const {f,q} of entries){if(!q)continue;const fd=food(f);if(!fd)continue;let it=items.find(i=>i.f===f&&!i.done);
    if(it){it.q=(num(it.q)||0)+q;if(src&&!(it.src||[]).includes(src))(it.src=it.src||[]).push(src)}
    else items.push({id:uid(),f,name:fd.n,q,r:fd.r||"aut",done:false,src:src?[src]:[]})}
  put("app/shopping",{items});
}
function autoQty(){
  const e=S.edit;const port=Math.max(1,num(e.portions)||1);const T=editTarget();const p=active();const base=typeTargets(p,p.def||p.types[0].id);
  const P=base.p*T/base.k;
  const role=f=>{if(f.v)return "veg";const pk=f.p*4/f.k,gk=f.g*4/f.k,lk=f.l*9/f.k;if(lk>0.85)return "fat";if(pk>=0.33)return "prot";if(gk>=0.6&&f.k>=60)return "starch";return "other"};
  const rows=e.items.map(it=>({it,f:food(it.f)})).filter(x=>x.f);rows.forEach(x=>x.role=role(x.f));
  const q={};let k=0,pp=0;const add=(x,g)=>{q[x.f.id]=g;k+=x.f.k*g/100;pp+=x.f.p*g/100};
  const vegs=rows.filter(x=>x.role==="veg");vegs.forEach(x=>{q[x.f.id]=Math.round(150/Math.max(1,vegs.length))});
  rows.filter(x=>x.role==="fat").forEach(x=>add(x,5));
  rows.filter(x=>x.role==="other").forEach(x=>add(x,x.f.k>450?10:x.f.k>200?30:60));
  const prot=rows.filter(x=>x.role==="prot");
  prot.forEach(x=>add(x,Math.min(180,Math.max(30,Math.max(0,P*0.75-pp)/prot.length/(x.f.p/100)))));
  const st=rows.filter(x=>x.role==="starch");
  if(st.length){const rem=Math.max(0,T-k);st.forEach(x=>add(x,Math.min(160,Math.max(20,rem/st.length/(x.f.k/100)))))}
  if(k>0&&Math.abs(k-T)>T*0.08){const sc=T/k;rows.filter(x=>x.role!=="veg"&&x.role!=="fat").forEach(x=>{q[x.f.id]*=sc})}
  e.items.forEach(it=>{if(q[it.f]!=null){const g=q[it.f]*port;it.q=g<20?Math.round(g):Math.round(g/5)*5}});
  toast("Quantités proposées : ajuste-les si besoin");render();
}
function spreadWeek(){
  const ws=S.weekStart;const dishes=(S.weeks[ws]?.dishes||[]).filter(id=>S.recipes[id]);const ps=profiles();
  const slots=[];const use={};const byDay={};const out={};
  for(let i=0;i<7;i++){const k=addDays(ws,i);const dv=dayV(k);for(const [slot] of ALLMEALS){const eaters=ps.filter(p=>p.meals.includes(slot));if(!eaters.length)continue;const cur=dv.meals[slot].ids.filter(id=>S.recipes[id]);if(cur.length){cur.forEach(id=>{use[id]=(use[id]||0)+1;(byDay[k]=byDay[k]||[]).push(id)});continue}slots.push({k,slot,target:refTarget(slot),eaters})}}
  for(const s of slots){const cat=catOfSlot(s.slot);const ok=r=>(r.cat||"plat")===cat&&s.eaters.every(p=>allowed(p,r));let pool=dishes.map(id=>S.recipes[id]).filter(ok);if(!pool.length)pool=recipes().filter(ok);if(!pool.length)continue;
    const best=pool.map(r=>{const f=s.target/(recipeNut(r).k||s.target);return {r,sc:Math.abs(Math.log(f))+(use[r.id]||0)*0.45+((byDay[s.k]||[]).includes(r.id)?3:0)+hash(s.k+s.slot+r.id)*0.15}}).sort((a,b)=>a.sc-b.sc)[0].r;
    use[best.id]=(use[best.id]||0)+1;(byDay[s.k]=byDay[s.k]||[]).push(best.id);(out[s.k]=out[s.k]||{})[s.slot]=[best.id]}
  let n=0;for(const k in out){editDay(k,dv=>{for(const slot in out[k]){dv.meals[slot].ids=out[k][slot];n++}})}
  toast(n?n+" repas placés":"Tous les repas sont déjà choisis");
}
function weekToShopping(){
  const ws=S.weekStart;const agg={};const desParts={};let n=0;
  for(let i=0;i<7;i++){const k=addDays(ws,i);const plan=planDay(k);for(const p of profiles()){const pl=plan.people[p.id];for(const slot of p.meals){const m=pl.meals[slot];if(!m||m.away)continue;if(m.rs.length)n++;for(const r of m.rs){const mult=m.f/(num(r.portions)||1);for(const it of r.items||[])agg[it.f]=(agg[it.f]||0)+num(it.q)*mult}for(const x of (m.des||[]))desParts[x.r.id]=(desParts[x.r.id]||0)+x.parts}}}
  for(const id in desParts){const r=S.recipes[id];const wholes=Math.ceil(desParts[id]/(num(r.portions)||1)-1e-9);for(const it of r.items||[])agg[it.f]=(agg[it.f]||0)+num(it.q)*wholes}
  addShopping(Object.entries(agg).map(([f,q])=>({f,q})),"Semaine "+isoWeek(ws));
  toast(n+" repas ajoutés aux courses");
}

document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=A[el.dataset.a];if(!a)return;if(el.dataset.a==="bgclose"&&e.target!==el)return;e.preventDefault();a(el,e)});
document.addEventListener("input",e=>{
  const el=e.target;const t=el.dataset&&el.dataset.in;if(!t)return;
  if(t==="q"){S.q[el.dataset.q]=el.value;render()}
  else if(t==="pickq"){S.sheet.q=el.value;render()}
  else if(t==="edit"){S.edit[el.dataset.k]=el.value;if(el.dataset.k!=="note")render()}
  else if(t==="qty"){S.edit.items[+el.dataset.i].q=el.value;render()}
  else if(t==="pf"){setPath(S.pform,el.dataset.path,el.value);if(el.tagName==="SELECT"||el.dataset.path==="name")render()}
});
document.addEventListener("change",e=>{
  const el=e.target;const t=el.dataset&&el.dataset.in;if(!t)return;
  if(t==="fridge"){const have=new Set(S.fridge.have||[]);el.checked?have.add(el.dataset.id):have.delete(el.dataset.id);put("app/fridge",{have:[...have]})}
  else if(t==="shopdone"){put("app/shopping",{items:(S.shopping.items||[]).map(i=>i.id===el.dataset.id?{...i,done:el.checked}:i)})}
  else if(t==="adddish"&&el.value){const ws=S.weekStart;const d=(S.weeks[ws]?.dishes||[]).slice();if(!d.includes(el.value))d.push(el.value);put("weeks/"+ws,{dishes:d})}
  else if(t==="photo"&&el.files&&el.files[0])readLabel(el.files[0]);
  else if(t==="importfile"&&el.files&&el.files[0]){importData(el.files[0]);el.value=""}
  else if(t==="dishphoto"&&el.files&&el.files[0])readDishPhoto(el.files[0]);
  else if(t==="pfmeal"){const m=el.dataset.m;const ms=S.pform.meals;if(el.checked&&!ms.includes(m))ms.push(m);if(!el.checked)S.pform.meals=ms.filter(x=>x!==m);S.pform.meals.sort((a,b)=>ALLMEALS.findIndex(x=>x[0]===a)-ALLMEALS.findIndex(x=>x[0]===b));if(el.checked&&!num(S.pform.shares[m]))S.pform.shares[m]=25;render()}
  else if(t==="pfresto"){S.pform.types[+el.dataset.i].resto=el.checked;render()}
  else if(t==="pfcycle"){S.pform.cycle.on=el.checked;if(el.checked&&!S.pform.cycle.seq.length)S.pform.cycle.seq=S.pform.types.map(x=>x.id);render()}
  else if(t==="pfseq"){const seq=S.pform.cycle.seq;seq[+el.dataset.i]=el.value;S.pform.cycle.seq=seq.slice(0,6);let cut=S.pform.cycle.seq.indexOf("");if(cut>=0)S.pform.cycle.seq=S.pform.cycle.seq.slice(0,cut);render()}
  else if(t==="pf"&&el.tagName==="SELECT"){setPath(S.pform,el.dataset.path,el.value);render()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const id=e.target.id;
  if(id==="shopform"){const q=norm(S.q.shop);if(!q)return;const hit=allFoods().find(f=>norm(f.n)===q)||allFoods().find(f=>norm(f.n).startsWith(q));if(hit)A.shopadd({dataset:{id:hit.id}});else A.shopfree()}
  else if(id==="weighform"){const d=document.getElementById("wd").value;const kg=num(document.getElementById("wk").value);const n=document.getElementById("wn").value.trim();if(!d||!kg){toast("Indique une date et un poids");return}const pid=active().id;const first=profiles()[0].id;const es=(S.journal.entries||[]).filter(x=>!(x.d===d&&(x.p||first)===pid));es.push({d,kg,n,p:pid});put("app/journal",{entries:es});toast("Pesée enregistrée")}
  else if(id==="foodform"){const ff=S.foodForm;const g=x=>document.getElementById(x).value;const name=g("fn").trim();if(!name){toast("Donne un nom à l'aliment");return}
    const fid=ff.id||("c"+uid());const rec={n:name,k:num(g("fk")),p:num(g("fp")),g:num(g("fg")),l:num(g("fl")),u:num(g("fu")),un:g("fun").trim(),r:g("fr"),v:document.getElementById("fv").checked?1:0};
    put("foods/"+fid,rec);toast("Aliment enregistré");
    if(ff.back==="edit"){if(!S.edit.items.some(it=>it.f===fid))S.edit.items.push({f:fid,q:""});S.q.ing="";S.sheet={kind:"edit"}}else if(ff.back&&ff.back.kind)S.sheet=ff.back;else S.sheet=null;S.foodForm=null;render()}
});
async function shrink(file){try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1200/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));return b||file}catch(e){return file}}
async function readDishPhoto(file){
  if(!S.assets||!S.edit)return;S.dishBusy=true;render();
  try{const blob=await shrink(file);const res=await S.assets.upload(blob,blob!==file?{type:"image/jpeg"}:undefined);if(S.edit){if(S.edit.photo&&S.edit.photo!==S.edit.oldPhoto)S.assets.delete(S.edit.photo).catch(()=>{});S.edit.photo=res.id}toast("Photo ajoutée")}
  catch(e){toast(e&&e.code==="too_large"?"Photo trop lourde":e&&e.code==="unsupported_type"?"Format de photo non pris en charge (essaie JPEG ou PNG)":e&&e.code==="quota_or_state"?"Stockage des photos plein":"Envoi impossible, réessaie")}
  S.dishBusy=false;render();
}
async function readLabel(file){
  if(!S.sample)return;S.photoBusy=true;render();
  try{
    const out=await S.sample.json('Voici la photo d\'une étiquette nutritionnelle d\'un produit alimentaire. Lis les valeurs POUR 100 g (ou 100 ml). Réponds uniquement avec un objet JSON : {"nom": string (nom court du produit, ou "" si absent), "kcal": number, "proteines": number, "glucides": number, "lipides": number, "portion_g": number ou null (poids d\'une portion ou d\'une unité si indiqué)}. Utilise null pour une valeur illisible.',{images:file,modelTier:"default"});
    const ff=S.foodForm;if(!ff)return;
    if(out&&typeof out==="object"){if(out.nom&&!ff.n)ff.n=String(out.nom);if(out.kcal!=null)ff.k=out.kcal;if(out.proteines!=null)ff.p=out.proteines;if(out.glucides!=null)ff.g=out.glucides;if(out.lipides!=null)ff.l=out.lipides;if(out.portion_g)ff.u=out.portion_g;toast("Valeurs lues : vérifie-les avant d'enregistrer")}
  }catch(e){toast(e&&e.code==="not_granted"?"Lecture de photo refusée":e&&e.code==="image_rejected"?"Photo illisible, essaie une autre":"Lecture impossible, saisis les valeurs à la main")}
  S.photoBusy=false;render();
}

/* ---------- Local photos (IndexedDB) ---------- */
const BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const PhotoDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("jardin-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const d=this.db||await this.open();return new Promise((res,rej)=>{const t=d.transaction("p",mode);const req=fn(t.objectStore("p"));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error)})},
  put(id,b){return this.tx("readwrite",s=>s.put(b,id))},get(id){return this.tx("readonly",s=>s.get(id))},del(id){return this.tx("readwrite",s=>s.delete(id))}};
const URLS={};const PENDING={};
function photoURL(id){if(!id)return BLANK;if(URLS[id])return URLS[id];if(!PENDING[id]){PENDING[id]=1;PhotoDB.get(id).then(b=>{if(b){URLS[id]=URL.createObjectURL(b);render()}}).catch(()=>{})}return BLANK}

/* ---------- Backup ---------- */
function exportData(){
  const data={app:"jardin-a-table",v:1,date:new Date().toISOString(),profilesDoc:S.profilesDoc,settings:S.settings,recipes:S.recipes,foods:S.foods,days:S.days,weeks:S.weeks,shopping:S.shopping,fridge:S.fridge,journal:S.journal};
  const name="jardin-a-table-"+keyOf(new Date())+".json";const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  let file=null;try{file=new File([blob],name,{type:"application/json"})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Sauvegarde Jardin à table"}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.app!=="jardin-a-table")throw 0;
    for(const k of ["profilesDoc","settings","recipes","foods","days","weeks","shopping","fridge","journal"])if(o[k]!==undefined)S[k]=o[k];
    S.settings={...DEF_SET,...(S.settings||{})};S.recipes=S.recipes||{};S.foods=S.foods||{};S.days=S.days||{};S.weeks=S.weeks||{};S.shopping=S.shopping||{items:[]};S.fridge=S.fridge||{have:[]};S.journal=S.journal||{entries:[]};
    saveLocal();render();toast("Données importées")}catch(e){toast("Fichier non reconnu : choisis une sauvegarde Jardin à table")}};
  r.readAsText(file);
}

/* ---------- Boot ---------- */
S.mode="local";loadLocal();S.loaded=true;
if("indexedDB" in window)S.assets={upload:async(b)=>{const id="ph"+uid();await PhotoDB.put(id,b);return {id}},delete:async(id)=>{await PhotoDB.del(id);if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id]}}};
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
